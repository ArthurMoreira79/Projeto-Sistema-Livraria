<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book.Net - Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="bi bi-book"></i> Book.Net</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="listagem-livros.html">Listagem</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastro-livro.html">Cadastrar Livro</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastro-cliente.html">Cadastrar Cliente</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Linha de Cards de Resumo -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card text-white bg-success h-100">
                    <div class="card-body d-flex justify-content-between">
                        <div>
                            <h3 class="card-title">4.500</h3>
                            <p class="card-text">Livros no Acervo</p>
                        </div>
                        <i class="bi bi-journal-text fs-1 opacity-50"></i>
                    </div>
                    <div class="card-footer text-center"><small>Mais info <i class="bi bi-arrow-right-circle"></i></small></div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card text-white bg-danger h-100">
                    <div class="card-body d-flex justify-content-between">
                        <div>
                            <h3 class="card-title">15</h3>
                            <p class="card-text">Aluguéis Atrasados</p>
                        </div>
                        <i class="bi bi-exclamation-triangle fs-1 opacity-50"></i>
                    </div>
                    <div class="card-footer text-center"><small>Mais info <i class="bi bi-arrow-right-circle"></i></small></div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card text-white bg-info h-100">
                    <div class="card-body d-flex justify-content-between">
                        <div>
                            <h3 class="card-title">120</h3>
                            <p class="card-text">Vendas Hoje</p>
                        </div>
                        <i class="bi bi-cart-check fs-1 opacity-50"></i>
                    </div>
                    <div class="card-footer text-center"><small>Mais info <i class="bi bi-arrow-right-circle"></i></small></div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card text-white bg-warning h-100">
                    <div class="card-body d-flex justify-content-between">
                        <div>
                            <h3 class="card-title">8</h3>
                            <p class="card-text">Reservas Pendentes</p>
                        </div>
                        <i class="bi bi-calendar-event fs-1 opacity-50"></i>
                    </div>
                    <div class="card-footer text-center"><small>Mais info <i class="bi bi-arrow-right-circle"></i></small></div>
                </div>
            </div>
        </div>

        <!-- Linha de Botões de Ação Rápida -->
        <h5 class="mb-3">Acesso Rápido</h5>
        <div class="row g-3 text-center">
            <div class="col-6 col-md-3">
                <a href="cadastro-livro.html" class="text-decoration-none">
                    <div class="card action-card py-4">
                        <i class="bi bi-plus-circle text-primary fs-2"></i>
                        <h6 class="mt-2 text-dark">Cadastrar Livro</h6>
                    </div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a href="listagem-livros.html" class="text-decoration-none">
                    <div class="card action-card py-4">
                        <i class="bi bi-list-ul text-info fs-2"></i>
                        <h6 class="mt-2 text-dark">Buscar Livros</h6>
                    </div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a href="#" class="text-decoration-none">
                    <div class="card action-card py-4">
                        <i class="bi bi-people text-success fs-2"></i>
                        <h6 class="mt-2 text-dark">Clientes</h6>
                    </div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a href="#" class="text-decoration-none">
                    <div class="card action-card py-4">
                        <i class="bi bi-bag text-danger fs-2"></i>
                        <h6 class="mt-2 text-dark">Caixa</h6>
                    </div>
                </a>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
