<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book.Net - Cadastro de Livro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <!-- Incluir a mesma navbar do index aqui -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="bi bi-book"></i> Book.Net</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Cadastro de Livro</h4>
            </div>
            <div class="card-body">
                <div id="mensagem-erro" class="alert alert-danger d-none">Por favor, preencha todos os campos obrigatórios.</div>
                <div id="mensagem-sucesso" class="alert alert-success d-none">Livro cadastrado com sucesso!</div>

                <form id="form-livro">
                    <h5 class="text-secondary border-bottom pb-2 mb-3">Dados Obrigatórios</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-3">
                            <label for="isbn" class="form-label">ISBN *</label>
                            <input type="text" class="form-control" id="isbn" name="isbn" placeholder="Ex: 978-85...">
                        </div>
                        <div class="col-md-6">
                            <label for="nome" class="form-label">Nome do Livro *</label>
                            <input type="text" class="form-control" id="nome" name="nome">
                        </div>
                        <div class="col-md-3">
                            <label for="quantidade" class="form-label">Quantidade *</label>
                            <input type="number" class="form-control" id="quantidade" name="quantidade" min="1">
                        </div>
                        
                        <div class="col-md-4">
                            <label for="autor" class="form-label">Autor *</label>
                            <input type="text" class="form-control" id="autor" name="autor">
                        </div>
                        <div class="col-md-3">
                            <label for="editora" class="form-label">Editora *</label>
                            <input type="text" class="form-control" id="editora" name="editora">
                        </div>
                        <div class="col-md-2">
                            <label for="ano" class="form-label">Ano Pub. *</label>
                            <input type="number" class="form-control" id="ano" name="ano">
                        </div>
                        <div class="col-md-3">
                            <label for="assunto" class="form-label">Assunto *</label>
                            <select class="form-select" id="assunto" name="assunto">
                                <option value="">Selecione...</option>
                                <option value="Banco de Dados">Banco de Dados</option>
                                <option value="Redes">Redes</option>
                                <option value="Sistemas Operacionais">Sistemas Operacionais</option>
                                <option value="Desenvolvimento Web">Desenvolvimento Web</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label d-block">Tipo *</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipo" id="tipoCompra" value="Compra">
                                <label class="form-check-label" for="tipoCompra">Compra</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipo" id="tipoAluguel" value="Aluguel">
                                <label class="form-check-label" for="tipoAluguel">Aluguel</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label d-block">Origem *</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="origem" id="origemNacional" value="Nacional">
                                <label class="form-check-label" for="origemNacional">Nacional</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="origem" id="origemImportado" value="Importado">
                                <label class="form-check-label" for="origemImportado">Importado</label>
                            </div>
                        </div>
                    </div>

                    <h5 class="text-secondary border-bottom pb-2 mb-3">Precificação (Opcional)</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="precoVenda" class="form-label">Preço de Venda (R$)</label>
                            <input type="number" step="0.01" class="form-control" id="precoVenda" name="precoVenda">
                        </div>
                        <div class="col-md-4">
                            <label for="precoAluguel" class="form-label">Preço de Aluguel (R$)</label>
                            <input type="number" step="0.01" class="form-control" id="precoAluguel" name="precoAluguel">
                        </div>
                        <div class="col-md-4">
                            <label for="precoRenovacao" class="form-label">Preço de Renovação (R$)</label>
                            <input type="number" step="0.01" class="form-control" id="precoRenovacao" name="precoRenovacao">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="index.html" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar Livro</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/js/validation.js"></script>
</body>
</html>
