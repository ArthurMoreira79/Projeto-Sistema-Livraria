<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book.Net - Cadastro de Cliente</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="bi bi-book"></i> Book.Net</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="listagem-livros.html">Listagem Livros</a></li>
                    <li class="nav-item"><a class="nav-link active" href="cadastro-cliente.html">Cadastro Cliente</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-person-plus"></i> Cadastro de Cliente</h4>
            </div>
            <div class="card-body">
                <div id="mensagem-erro-cliente" class="alert alert-danger d-none">Por favor, preencha todos os campos obrigatórios (*).</div>
                <div id="mensagem-sucesso-cliente" class="alert alert-success d-none">Cliente cadastrado com sucesso!</div>

                <form id="form-cliente">
                    <!-- Dados Obrigatórios -->
                    <h5 class="text-secondary border-bottom pb-2 mb-3 mt-2">Dados Pessoais (Obrigatórios)</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-8">
                            <label for="nomeCliente" class="form-label">Nome Completo *</label>
                            <input type="text" class="form-control" id="nomeCliente" name="nomeCliente" placeholder="Ex: João da Silva">
                        </div>
                        <div class="col-md-4">
                            <label for="documento" class="form-label">Identidade e/ou CPF *</label>
                            <input type="text" class="form-control" id="documento" name="documento" placeholder="000.000.000-00">
                        </div>
                        <div class="col-md-4">
                            <label for="dataNascimento" class="form-label">Data de Nascimento *</label>
                            <input type="date" class="form-control" id="dataNascimento" name="dataNascimento">
                        </div>
                        <div class="col-md-8">
                            <label for="endereco" class="form-label">Endereço Completo *</label>
                            <input type="text" class="form-control" id="endereco" name="endereco" placeholder="Rua, Número, Bairro, CEP, Cidade - UF">
                        </div>
                        <div class="col-md-4">
                            <label for="telefonePrincipal" class="form-label">Telefone de Contato *</label>
                            <input type="tel" class="form-control" id="telefonePrincipal" name="telefonePrincipal" placeholder="(00) 00000-0000">
                        </div>
                    </div>

                    <!-- Dados Opcionais -->
                    <h5 class="text-secondary border-bottom pb-2 mb-3">Informações Adicionais (Opcionais)</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="cliente@exemplo.com">
                        </div>
                        <div class="col-md-6">
                            <label for="homePage" class="form-label">Home-page Pessoal</label>
                            <input type="url" class="form-control" id="homePage" name="homePage" placeholder="https://www.seusite.com.br">
                        </div>
                        <div class="col-md-4">
                            <label for="telefoneSecundario" class="form-label">Outro Telefone</label>
                            <input type="tel" class="form-control" id="telefoneSecundario" name="telefoneSecundario" placeholder="(00) 0000-0000">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="reset" class="btn btn-secondary">Limpar</button>
                        <button type="submit" class="btn btn-success">Salvar Cliente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/js/validation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
